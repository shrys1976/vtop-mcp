[project]
name = "vtop-mcp"
version = "0.1.0"
description = "Read-only MCP server for VIT Vellore VTOP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vtop_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/vtop_mcp", "docs", "scripts"]
