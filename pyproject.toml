[project]
name = "vtop-mcp"
version = "0.1.0"
description = "Read-only MCP server for VIT Vellore VTOP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "cryptography>=42",
  "httpx>=0.27",
  "keyring>=25",
  "pillow>=10",
  "pydantic>=2",
  "pydantic-settings>=2",
]

[project.optional-dependencies]
ocr = ["ddddocr>=1.5"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vtop_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/vtop_mcp/data/bitmaps.json" = "vtop_mcp/data/bitmaps.json"

[tool.hatch.build.targets.sdist]
include = ["src/vtop_mcp", "docs", "scripts"]
